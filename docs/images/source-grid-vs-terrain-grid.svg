<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Source grid versus terrain grid</title>
  <desc id="desc">A request extent crosses four one-kilometre COG files and is translated into a regular ArcGIS elevation tile.</desc>
  <defs>
    <pattern id="fineGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0 H0 V18" fill="none" stroke="#d7ddd7" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#243d2f"/>
    </marker>
    <style>
      .heading { font: 700 30px system-ui, sans-serif; fill: #131713; }
      .subhead { font: 700 18px system-ui, sans-serif; fill: #243d2f; }
      .body { font: 15px system-ui, sans-serif; fill: #4f5952; }
      .small { font: 13px system-ui, sans-serif; fill: #5e6861; }
      .code { font: 13px ui-monospace, monospace; fill: #243d2f; }
      .cog { fill: #fffef9; stroke: #7f8d83; stroke-width: 2; }
      .arrow { fill: none; stroke: #243d2f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#f4f2ec"/>
  <text x="60" y="62" class="heading">One request, two independent grids</text>
  <text x="60" y="96" class="body">The terrain tile does not inherit the 1 km boundaries of the source files.</text>

  <text x="70" y="145" class="subhead">SwissALTI source grid</text>
  <text x="70" y="169" class="small">Each cell is one 1,000 m × 1,000 m COG</text>

  <g transform="translate(70 195)">
    <rect class="cog" x="0" y="0" width="120" height="120"/>
    <rect class="cog" x="120" y="0" width="120" height="120"/>
    <rect class="cog" x="240" y="0" width="120" height="120"/>
    <rect class="cog" x="360" y="0" width="120" height="120"/>
    <rect class="cog" x="0" y="120" width="120" height="120"/>
    <rect class="cog" x="120" y="120" width="120" height="120"/>
    <rect class="cog" x="240" y="120" width="120" height="120"/>
    <rect class="cog" x="360" y="120" width="120" height="120"/>
    <rect class="cog" x="0" y="240" width="120" height="120"/>
    <rect class="cog" x="120" y="240" width="120" height="120"/>
    <rect class="cog" x="240" y="240" width="120" height="120"/>
    <rect class="cog" x="360" y="240" width="120" height="120"/>

    <text x="12" y="24" class="code">2609-1093</text>
    <text x="132" y="24" class="code">2610-1093</text>
    <text x="252" y="24" class="code">2611-1093</text>
    <text x="372" y="24" class="code">2612-1093</text>
    <text x="12" y="144" class="code">2609-1092</text>
    <text x="132" y="144" class="code">2610-1092</text>
    <text x="252" y="144" class="code">2611-1092</text>
    <text x="372" y="144" class="code">2612-1092</text>
    <text x="12" y="264" class="code">2609-1091</text>
    <text x="132" y="264" class="code">2610-1091</text>
    <text x="252" y="264" class="code">2611-1091</text>
    <text x="372" y="264" class="code">2612-1091</text>

    <rect x="190" y="70" width="174" height="150" rx="4" fill="#e69a4e" fill-opacity="0.28" stroke="#bd6d23" stroke-width="4"/>
    <text x="202" y="96" class="code">requested extent</text>
    <circle cx="240" cy="120" r="6" fill="#bd6d23"/>
  </g>

  <path class="arrow" d="M570 375 H650"/>
  <rect x="577" y="286" width="138" height="62" rx="31" fill="#243d2f"/>
  <text x="646" y="311" text-anchor="middle" style="font:700 14px system-ui,sans-serif;fill:#d8ff4f">CUSTOM</text>
  <text x="646" y="332" text-anchor="middle" style="font:700 14px system-ui,sans-serif;fill:#fffef9">ADAPTER</text>

  <text x="740" y="145" class="subhead">ArcGIS terrain tile</text>
  <text x="740" y="169" class="small">One regular output array for this LOD request</text>

  <g transform="translate(760 195)">
    <rect width="360" height="360" fill="#fffef9" stroke="#243d2f" stroke-width="3"/>
    <rect width="360" height="360" fill="url(#fineGrid)"/>
    <path d="M180 0 V360 M0 180 H360" stroke="#bd6d23" stroke-width="3" stroke-dasharray="9 8"/>
    <circle cx="0" cy="0" r="6" fill="#243d2f"/>
    <circle cx="360" cy="0" r="6" fill="#243d2f"/>
    <circle cx="0" cy="360" r="6" fill="#243d2f"/>
    <circle cx="360" cy="360" r="6" fill="#243d2f"/>
    <rect x="86" y="138" width="188" height="84" rx="12" fill="#fffef9" stroke="#cbd3cb" stroke-width="2"/>
    <text x="180" y="170" text-anchor="middle" class="subhead">257 × 257 elevations</text>
    <text x="180" y="196" text-anchor="middle" class="small">one Float32 output grid</text>
  </g>

  <g transform="translate(70 594)">
    <rect width="1060" height="48" rx="12" fill="#e6eadf"/>
    <text x="22" y="30" class="body">Same coordinates, different boundaries: EPSG:2056 lets the adapter resample and copy values without coordinate reprojection.</text>
  </g>
</svg>
